<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The tiny joy button</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:#f4f0e7;color:#203c35;font-family:system-ui,sans-serif;padding:24px}
main{width:min(100%,640px);text-align:center}.tag{font-size:12px;letter-spacing:.18em;text-transform:uppercase}
h1{font-size:clamp(44px,9vw,76px);line-height:1.04;letter-spacing:-.06em;margin:24px 0}
.intro{color:#62746b;font-size:18px;line-height:1.6}
button{border:0;border-radius:100px;background:#d3fa71;color:#203c35;padding:24px 38px;font:700 19px system-ui;cursor:pointer;box-shadow:0 7px 0 #203c35;margin:32px 0 24px;transition:transform .15s,box-shadow .15s}
button:hover{transform:translateY(-3px);box-shadow:0 10px 0 #203c35}button:active{transform:translateY(5px);box-shadow:0 2px 0 #203c35}button:focus-visible{outline:3px solid #203c35;outline-offset:8px}
#message{min-height:64px;font-size:20px;line-height:1.5}footer{margin-top:40px;font-size:12px;color:#62746b}.spark{position:fixed;pointer-events:none;font-size:28px;animation:float 850ms ease-out forwards}
@keyframes float{to{transform:translate(var(--x),-150px) rotate(35deg);opacity:0}}
@media(prefers-reduced-motion:reduce){button{transition:none}.spark{display:none}}
</style>
</head>
<body>
<main>
<p class="tag">Nikhil's little internet experiment · 001</p>
<h1>A tiny button.<br>A little joy.</h1>
<p class="intro">No grand purpose. Just a good excuse to press something.</p>
<button id="joy" type="button">Make something happen ↗</button>
<p id="message" aria-live="polite" aria-atomic="true">Your daily dose of delightful nonsense awaits.</p>
<footer><span id="count">0</span> moments of joy · made for practice</footer>
</main>
<script>
const messages = [
"You have been promoted to Chief Button Officer.",
"Somewhere, a very small frog is applauding you.",
"Achievement unlocked: excellent clicking.",
"The universe has received your boop.",
"One tiny click for you. One giant leap for this button.",
"Plot twist: the button believes in you."
];
const button = document.getElementById("joy");
let clicks = 0;
let previous = -1;
button.addEventListener("click", () => {
let next;
do { next = Math.floor(Math.random() * messages.length); } while (next === previous);
previous = next;
document.getElementById("message").textContent = messages[next];
document.getElementById("count").textContent = ++clicks;
if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
const rect = button.getBoundingClientRect();
for (let i = 0; i < 7; i++) {
const spark = document.createElement("span");
spark.className = "spark";
spark.setAttribute("aria-hidden", "true");
spark.textContent = ["✦", "✧", "★"][i % 3];
spark.style.left = (rect.left + rect.width * Math.random()) + "px";
spark.style.top = rect.top + "px";
spark.style.setProperty("--x", ((Math.random() - .5) * 220) + "px");
document.body.appendChild(spark);
spark.addEventListener("animationend", () => spark.remove(), { once: true });
}
});
</script>
</body>
</html>
